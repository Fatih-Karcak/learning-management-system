name: Verify LMS
on:
  pull_request:
  push:
    branches: [main, work]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: maven }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - working-directory: backend
        run: bash user-service/mvnw -B '-Dtest=*Test' -Dsurefire.failIfNoSpecifiedTests=false -Dlms.ffmpeg.tests=true verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          {
            name: backend-results,
            path: "backend/**/target/surefire-reports/*.xml",
          }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - working-directory: frontend
        run: npm ci
      - run: node --test deploy/scripts/*.test.mjs
      - name: Validate local staging configuration
        run: |
          node deploy/scripts/prepare-staging.mjs "$RUNNER_TEMP/lms-staging.env"
          node deploy/scripts/check-config.mjs "$RUNNER_TEMP/lms-staging.env"
          docker compose --env-file "$RUNNER_TEMP/lms-staging.env" -f deploy/compose.yml -f deploy/compose.staging.yml config --quiet
          for script in deploy/scripts/*.sh; do bash -n "$script"; done
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - working-directory: frontend
        run: npx playwright install --with-deps chrome
      - working-directory: frontend
        run: npm test && npm run build && npm run format:check
      - working-directory: frontend
        env: { E2E_VIDEO: "1", PLAYWRIGHT_BROWSER_CHANNEL: chrome }
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-results, path: frontend/test-results }
