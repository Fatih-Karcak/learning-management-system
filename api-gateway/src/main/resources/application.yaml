server:
  port: 8080

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 2GB
      max-request-size: 2GB

  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

services:
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}
  course:
    base-url: ${COURSE_SERVICE_URL:http://localhost:8082}
  enrollment:
    base-url: ${ENROLLMENT_SERVICE_URL:http://localhost:8083}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
  content:
    base-url: ${CONTENT_SERVICE_URL:http://localhost:8085}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics