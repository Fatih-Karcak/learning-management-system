<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, sans-serif; background:#f4f6f8; padding:40px;">
<div style="max-width:520px;margin:0 auto;background:#fff;border-radius:8px;padding:32px;">
    <h1 style="color:#d97706;">Congratulations! 🎓</h1>
    <p>Hello <span th:text="${studentName}">Learner</span>,</p>
    <p><strong th:text="${courseTitle}">Course title</strong> is complete. Your certificate is ready!</p>
    <p style="color:#64748b;font-size:14px;">Verification code: <strong th:text="${verificationCode}">CODE</strong></p>
</div>
</body>
</html>
