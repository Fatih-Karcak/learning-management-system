server:
  port: 8085

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: content-service
  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 2GB
      max-request-size: 2GB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/lms_content
    username: ${DB_USERNAME:lms_user}
    password: ${DB_PASSWORD:lms_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:lms_minio_admin}
  secret-key: ${MINIO_SECRET_KEY:lms_minio_secret123}
  bucket:
    raw: lms-raw-videos
    hls: lms-hls
    images: lms-images

services:
  enrollment:
    base-url: ${ENROLLMENT_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

internal:
  api-key: ${INTERNAL_API_KEY:}
