server:
  port: 8083

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: enrollment-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/lms_enrollments
    username: ${DB_USERNAME:lms_user}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: enrollment-service
      enable-auto-commit: false
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET}

internal:
  api-key: ${INTERNAL_API_KEY}

services:
  course:
    base-url: ${COURSE_SERVICE_URL:http://localhost:8082}
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}

minio:
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket:
    certificates: ${MINIO_CERTIFICATES_BUCKET:lms-certificates}

enrollment:
  outbox-interval-ms: 5000
  certificate-interval-ms: 30000
  refund-reconciliation-interval-ms: 30000
