<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page { size: A4 landscape; margin: 24px; }
        body {
            font-family: 'LMS Sans', sans-serif;
            background: #fff;
            margin: 0;
            padding: 0;
        }
        .certificate {
            border: 8px solid #2563eb;
            padding: 24px;
            text-align: center;
            min-height: 430px;
        }
        .title {
            font-size: 30px;
            color: #1e3a8a;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 12px;
        }
        .student-name {
            font-size: 26px;
            color: #0f172a;
            font-weight: bold;
            border-bottom: 2px solid #2563eb;
            display: inline-block;
            padding-bottom: 8px;
            margin: 10px 0;
        }
        .course-title {
            font-size: 20px;
            color: #1d4ed8;
            margin: 10px 0;
            font-style: italic;
        }
        .meta {
            font-size: 14px;
            color: #64748b;
            margin-top: 12px;
        }
        .verification {
            margin-top: 12px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div class="certificate">
    <div class="title">CERTIFICATE OF COMPLETION</div>
    <div class="subtitle">This certifies that the learner named below has successfully completed the course.</div>

    <p style="font-size:16px; color:#475569;">Presented to</p>
    <div class="student-name" th:text="${studentName}">Learner name</div>

    <p style="font-size:16px; color:#475569;">for successfully completing</p>
    <div class="course-title" th:text="${courseTitle}">Course title</div>
    <p style="font-size:16px; color:#475569;">Congratulations on your achievement.</p>

    <div class="meta">
        <p>Instructor: <strong th:text="${instructorName}">Instructor name</strong></p>
        <p>Completion date: <strong th:text="${issuedAt}">Date</strong></p>
    </div>

    <div class="verification">
        Verification code: <strong th:text="${verificationCode}">CODE</strong>
    </div>
</div>
</body>
</html>
