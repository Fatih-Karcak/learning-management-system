server:
  port: 8083

spring:
  application:
    name: enrollment-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/lms_enrollments
    username: ${DB_USERNAME:lms_user}
    password: ${DB_PASSWORD:lms_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: enrollment-service
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

services:
  course:
    base-url: ${COURSE_SERVICE_URL:http://localhost:8082}
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:lms_minio_admin}
  secret-key: ${MINIO_SECRET_KEY:lms_minio_secret123}
  bucket:
    certificates: lms-certificates

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics