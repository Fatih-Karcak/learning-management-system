global:
  scrape_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: lms
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          [
            user-service:8081,
            course-service:8082,
            enrollment-service:8083,
            content-service:8085,
            notification-service:8086,
            api-gateway:8080,
          ]
